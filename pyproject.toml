[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cvar-quantum-research"
version = "0.1.0"
description = "CVaR QAOA/VQE research framework for combinatorial optimisation"
readme = "README.md"
authors = [
    { name = "Miguel Sousa Maciel Silva", email = "miguel.maciel_silva@student-cs.fr" },
    { name = "Hugo Le Roy" },
]
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.0.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
pdfo = [
    "pdfo>=2.0",
]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
ignore_missing_imports = true
strict = false
